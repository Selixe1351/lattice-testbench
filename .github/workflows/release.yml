name: release
# Push a tag such as v0.2.0 to build the installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx electron-vite build
      # electron-builder takes the version from the tag, and publishes latest.yml next to the installer, which
      # is what installed copies read to find updates.
      - run: npx electron-builder --win --publish always -c.extraMetadata.version=${GITHUB_REF_NAME#v}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
