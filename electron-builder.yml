appId: dev.lattice-testbench.app
productName: Lattice Testbench
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target: nsis
  # assets/icon.png, rendered from assets/icon.svg by `npm run icon`; electron-builder makes the .ico from it.
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces and no version, so releases/latest/download/Lattice-Testbench-Setup.exe is always the newest installer.
  artifactName: Lattice-Testbench-Setup.${ext}
# Where installed copies look for updates. The GitHub repository that hosts releases.
publish:
  provider: github
  owner: Selixe1351
  repo: lattice-testbench
